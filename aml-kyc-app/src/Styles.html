<style>
:root{
  --bg:#f3f5f8;--panel:#ffffff;--ink:#17202b;--muted:#5d6b7c;--line:#dfe4ea;--nav:#0b2a44;--nav-ink:#c9d6e3;--nav-active:#16466f;
  --brand:#0f5c99;--brand-ink:#ffffff;--ok:#1b7f4b;--ok-bg:#e3f5ea;--warn:#946200;--warn-bg:#fff2d1;--bad:#b3261e;--bad-bg:#fde7e5;--info:#0f5c99;--info-bg:#e2effa;--gray-bg:#eceff3;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--radius:8px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10161d;--panel:#18212b;--ink:#e7edf3;--muted:#93a1b1;--line:#2b3846;--nav:#0a1520;--nav-ink:#b5c3d1;--nav-active:#17385a;
  --brand:#4aa3e8;--brand-ink:#08131d;--ok:#5fd394;--ok-bg:#12321f;--warn:#f0c15a;--warn-bg:#3a2d0b;--bad:#ff8a80;--bad-bg:#3d1714;--info:#7cc0f5;--info-bg:#132b40;--gray-bg:#232e3a;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 8px}
a{color:var(--brand);cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
#app{display:flex;min-height:100vh}
#side{width:240px;background:var(--nav);color:var(--nav-ink);flex:none;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
#side .logo{padding:18px 16px;color:#fff;font-weight:700;font-size:15px;line-height:1.2;border-bottom:1px solid rgba(255,255,255,.08)}
#side .logo small{display:block;font-weight:400;color:var(--nav-ink);font-size:11px;margin-top:3px}
#side .grp{padding:14px 16px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.65}
#side a.nav{display:block;padding:8px 16px 8px 20px;color:var(--nav-ink);border-left:3px solid transparent}
#side a.nav.sub{padding-left:34px;font-size:13px}
#side a.nav:hover{background:rgba(255,255,255,.05);text-decoration:none}
#side a.nav.active{background:var(--nav-active);color:#fff;border-left-color:#5db4ff}
#side .me{margin-top:auto;padding:12px 16px;font-size:12px;border-top:1px solid rgba(255,255,255,.08)}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:16px;align-items:center;position:sticky;top:0;z-index:5}
#top .search{flex:1;max-width:560px;position:relative}
#top input{width:100%}
#results{position:absolute;left:0;right:0;top:38px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:60vh;overflow:auto;display:none;z-index:20}
#results .r{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}#results .r:hover{background:var(--gray-bg)}
#view{padding:24px;max-width:1500px;width:100%}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g6{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);cursor:default}
.stat.click{cursor:pointer}.stat.click:hover{border-color:var(--brand)}
.stat .n{font-size:26px;font-weight:700;line-height:1.1}.stat .l{color:var(--muted);font-size:12px;margin-top:4px}
.stat.bad .n{color:var(--bad)}.stat.warn .n{color:var(--warn)}.stat.ok .n{color:var(--ok)}
.sect-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;background:var(--panel);position:sticky;top:0}
tbody tr:hover{background:var(--gray-bg)}tr.click{cursor:pointer}
.tbl-wrap{overflow-x:auto}
td.act{white-space:nowrap;text-align:right}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
input[readonly],input:disabled,select:disabled,textarea:disabled{background:var(--gray-bg);color:var(--muted)}
textarea{width:100%;min-height:70px;resize:vertical}
button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 13px;cursor:pointer}
button:hover{background:var(--gray-bg)}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}button.primary:hover{filter:brightness(1.1)}
button.danger{color:var(--bad);border-color:var(--bad)}button.danger:hover{background:var(--bad-bg)}
button.ok{color:var(--ok);border-color:var(--ok)}button.ok:hover{background:var(--ok-bg)}
button.sm{padding:3px 9px;font-size:12px}
button:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--gray-bg);color:var(--muted)}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-info{background:var(--info-bg);color:var(--info)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:9px 14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{text-decoration:none;color:var(--ink)}.tabs a.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px 24px}
.kv .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.kv .v{word-break:break-word}
.alert{padding:10px 14px;border-radius:6px;margin-bottom:10px;border:1px solid}
.alert.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}.alert.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.alert.info{background:var(--info-bg);color:var(--info);border-color:var(--info)}.alert.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.alert ul{margin:4px 0 0 18px;padding:0}
.muted{color:var(--muted)}.right{text-align:right}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hdr-card{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hdr-card .t{font-size:20px;font-weight:700}
.progress{height:8px;background:var(--gray-bg);border-radius:6px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--ok)}
#modal-root .ov{position:fixed;inset:0;background:rgba(10,20,30,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:5vh 12px}
.modal{background:var(--panel);border-radius:10px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.lg{max-width:1000px}.modal.sm{max-width:460px}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mb{padding:18px;max-height:70vh;overflow:auto}.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 16px}
.form .f{display:flex;flex-direction:column;gap:3px}.form .f.wide{grid-column:1/-1}.form label{font-size:12px;color:var(--muted)}.form .req::after{content:" *";color:var(--bad)}
.form .f input,.form .f select{width:100%}
#toast-root{position:fixed;right:18px;bottom:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--nav);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:420px}.toast.err{background:var(--bad);color:#fff}.toast.ok{background:var(--ok);color:#fff}
.checklist .it{display:grid;grid-template-columns:28px minmax(180px,1fr) 60px minmax(160px,1.2fr);gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.chain{padding:8px 0;border-bottom:1px solid var(--line)}.chain .arrow{color:var(--muted);margin:0 6px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}@keyframes sp{to{transform:rotate(360deg)}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px}
.empty{padding:28px;text-align:center;color:var(--muted)}
pre.json{white-space:pre-wrap;word-break:break-word;font-size:12px}
@media (max-width:900px){#side{position:fixed;left:-260px;z-index:30;transition:left .2s}#side.open{left:0}#view{padding:14px}#top{padding:10px 14px}.menu-btn{display:inline-block!important}}
.menu-btn{display:none}
@media print{#side,#top,button{display:none!important}}
</style>
